function formatCost(v){const n=Number(v);if(n>=1e12)return n.toExponential(0);return n.toLocaleString("en-US",{maximumFractionDigits:0});}
let answer, guesses, ended, wonGame=false;
function start(){answer=pickTarget();guesses=[];ended=false;wonGame=false;$ ("shareStatus").textContent="";$("newGame").textContent="End game";$("history").innerHTML='<tr><td colspan="4" class="historyempty">Your guesses will appear here.</td></tr>';$("status").textContent="Pick any emote from the list to start.";$("guess").value="";$("guess").disabled=false;$("guessBtn").disabled=false;$("counter").textContent="0 / 8 guesses";$("guess").focus();}
function chip(text,cls){return `<span class="chip ${cls}">${text}</span>`}
function costHint(guess){
 if(guess.cost===null||answer.cost===null)return chip("Unknown","neutral");
 if(guess.currency!==answer.currency)return chip("Different currency","neutral");
 const a=Number(guess.cost),b=Number(answer.cost);
 if(a===b)return chip(`${money(guess)} · Equal`,"good");
 return chip(`${money(guess)} · ${a<b?"↑ Higher":"↓ Lower"}`, "bad");
}
function submitGuess(raw){
 if(ended)return;
 const name=raw.trim().toLocaleLowerCase();
 const guess=GUESS_POOL.find(e=>e.name.toLocaleLowerCase()===name);
 if(!guess){$("status").textContent="Choose an emote from the autocomplete list.";return;}
 if(guesses.some(e=>e.name===guess.name)){$("status").textContent="You've already guessed that emote.";return;}
 guesses.push(guess);
 if(guesses.length===1)$("history").innerHTML="";
 const won=guess.name===answer.name;
 const row=document.createElement("tr");
 row.innerHTML=`<td>${escapeHtml(guess.name)} ${won? "🏆":""}</td><td>${costHint(guess)}</td><td>${chip(escapeHtml(guess.type),guess.type===answer.type?"good":"bad")}</td><td>${chip(guess.effects?"True":"False",guess.effects===answer.effects?"good":"bad")}</td>`;
 $("history").prepend(row);
 $("counter").textContent=`${guesses.length} / 8 guesses`;
 $("guess").value="";
 if(won){ended=true;wonGame=true;$("status").textContent=`Correct! The emote was: ${answer.name}`;finish();}
 else if(guesses.length>=8){ended=true;$("status").textContent=`No guesses left. The emote was: ${answer.name} (${money(answer)}, ${answer.type}, effects: ${answer.effects}).`;finish();}
 else $("status").textContent="Not quite — use the clues in your history.";
}
function finish(){$("guess").disabled=true;$("guessBtn").disabled=true;$("newGame").textContent="New Game?";}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function costColor(guess){
 if(Number(guess.cost)===Number(answer.cost)&&guess.currency===answer.currency)return '🟩';
 if(guess.currency!==answer.currency)return '🟥';
 return '🟨';
}
function resultText(){
 const count=wonGame?guesses.length:'X';
 const lines=['IA Emote Wordle',`Guesses: ${count}/8`,`${wonGame?'✅':'❌'} ${answer.name}`];
 for(const g of guesses){
  const cost=costColor(g);
  const type=g.type===answer.type?'🟩':'🟥';
  const effects=g.effects===answer.effects?'🟩':'🟥';
  lines.push(`${cost} ${type} ${effects}`);
 }
 const pageUrl=/^https?:$/.test(location.protocol)?location.href:'site.link.here.com';
 lines.push('',pageUrl);
 return lines.join('\n');
}
async function shareResult(){
 if(!ended){$('shareStatus').textContent='Finish or end the game before sharing your result.';return;}
 const result=resultText();
 try{
  await navigator.clipboard.writeText(result);
  $('shareStatus').textContent='Result copied to clipboard! Paste it wherever you want to share.';
 }catch(err){
  const area=document.createElement('textarea');area.value=result;area.readOnly=true;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();
  const copied=document.execCommand('copy');area.remove();
  $('shareStatus').textContent=copied?'Result copied to clipboard! Paste it wherever you want to share.':'Copy this result manually:\n'+result;
 }
}
$('shareResult').addEventListener('click',shareResult);
$("guessForm").addEventListener("submit",e=>{e.preventDefault();submitGuess($("guess").value);});
$("newGame").addEventListener("click",()=>{if(!ended){ended=true;$("status").textContent=`The emote was: ${answer.name}`;finish();}else{start();}});
$("emoteOptions").innerHTML=GUESS_POOL.map(e=>`<option value="${escapeHtml(e.name)}"></option>`).join("");
$("catalogCount").textContent=EMOTES.length;
function drawCatalog(q=""){$("catalogList").innerHTML=EMOTES.filter(e=>e.name.toLowerCase().includes(q.toLowerCase())).map(e=>`<li>${escapeHtml(e.name)} <small>(${escapeHtml(e.type)})</small></li>`).join("");}
$("searchCatalog").addEventListener("input",e=>drawCatalog(e.target.value));
drawCatalog();start();
</script></body></html>
